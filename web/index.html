<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIIntelAgentPro</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
            background: #f1f5f9;
            color: #1e293b;
        }

        h1 {
            margin-bottom: 24px;
            color: #2563eb;
            font-size: 36px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            margin: 4px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        input,
        select {
            margin-top: 18px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 14px;
        }

        #stats,
        #health {
            margin-top: 20px;
            padding: 18px 22px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        #health {
            color: #16a34a;
            font-weight: bold;
        }

        table {
            width: 100%;
            margin-top: 24px;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #dbeafe;
            color: #1e3a8a;
        }

        tr:hover {
            background: #f8fafc;
        }

        .analyzed {
            color: #16a34a;
            font-weight: bold;
        }

        .unanalyzed {
            color: #dc2626;
            font-weight: bold;
        }

        #stats {
            display: flex;
            gap: 16px;
        }

        .stat-card {
            flex: 1;
            padding: 18px;
            border-radius: 10px;
            background: #eff6ff;
        }

        .stat-card span {
            display: block;
            color: #64748b;
            margin-bottom: 8px;
        }

        .stat-card strong {
            font-size: 28px;
            color: #2563eb;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px 12px;
            }

            h1 {
                font-size: 28px;
            }

            #stats {
                flex-direction: column;
            }

            input,
            select,
            button {
                width: 100%;
                margin: 6px 0;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
        body.dark {
            background: #0f172a;
            color: #e2e8f0;
        }

        body.dark h1 {
            color: #60a5fa;
        }

        body.dark #stats,
        body.dark #health,
        body.dark table {
            background: #1e293b;
            color: #e2e8f0;
        }

        body.dark th {
            background: #334155;
            color: #bfdbfe;
        }

        body.dark td {
            border-color: #475569;
        }

        body.dark tr:hover {
            background: #334155;
        }
        body.dark button {
            background: #3b82f6;
            color: white;
        }

        body.dark button:hover {
            background: #60a5fa;
            color: #0f172a;
        }

        body.dark input,
        body.dark select {
            background: #1e293b;
            color: #e2e8f0;
            border-color: #64748b;
        }

        body.dark .stat-card {
            background: #334155;
        }

        body.dark .stat-card span {
            color: #cbd5e1;
        }

        body.dark .stat-card strong {
            color: #93c5fd;
        }

        body.dark #health {
            background: #1e293b;
            color: #4ade80;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            position: relative;
            width: min(600px, 100%);
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px;
            border-radius: 14px;
            background: white;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 14px;
            padding: 4px 10px;
            background: transparent;
            color: #64748b;
            font-size: 26px;
        }

        .modal-close:hover {
            background: transparent;
            color: #dc2626;
            transform: none;
        }

        body.dark .modal-content {
            background: #1e293b;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <h1>AI 资讯分析系统</h1>
    <button id="theme-button" onclick="toggleDarkMode()">
        切换深色模式
    </button>
    <button id="batch-button" onclick="analyzeBatch()">
        批量分析文章
    </button>
    <button onclick="loadArticles()">刷新文章</button>
    <button onclick="importDevArticles()">导入 DEV 文章</button>
    <button onclick="runPipeline()">一键导入并分析</button>
    <div>
        <input id="keyword" placeholder="搜索标题">

        <select id="category">
            <option value="">全部分类</option>
            <option value="Agent应用">Agent应用</option>
            <option value="技术优化">技术优化</option>
            <option value="DEV/AI">DEV/AI</option>
        </select>

        <select id="analyzed">
            <option value="">全部状态</option>
            <option value="true">已分析</option>
            <option value="false">未分析</option>
        </select>

        <button onclick="filterArticles()">筛选</button>
    </div>
    <div id="stats">
        正在读取统计数据……
    </div>
    <div id="health">
        正在检查服务状态……
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>标题</th>
                <th>分类</th>
                <th>来源</th>
                <th>重要程度</th>
                <th>分析状态</th>
                <th>操作</th>
            </tr>
        </thead>

        <tbody id="article-list"></tbody>
    </table>

    <div  id="analysis-modal"
          class="modal"
          onclick="closeAnalysisModal(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeAnalysisModal()">×</button>
            <h2>文章分析结果</h2>
            <div id="analysis-content"></div>
        </div>
    </>

    <div>
        <button onclick="previousPage()">上一页</button>
        <span id="page-info">第 1 页</span>
        <button onclick="nextPage()">下一页</button>
    </div>

    <script>
        let currentOffset = 0;
        const pageSize = 10;
        let currentPageCount = 0;

        async function loadArticles() {
            const keyword = document.getElementById("keyword").value;
            const category = document.getElementById("category").value;
            const analyzed = document.getElementById("analyzed").value;

            const params = new URLSearchParams();

            if (keyword) {
                params.append("keyword", keyword);
            }

            if (category) {
                params.append("category", category);
            }

            if (analyzed) {
                params.append("analyzed", analyzed);
            }

            params.append("limit", pageSize);
            params.append("offset", currentOffset);
            const response = await fetch(`/articles?${params.toString()}`);
            const articles = await response.json();
            currentPageCount = articles.length;

            const list = document.getElementById("article-list");
            list.innerHTML = "";

            for (const article of articles) {
                const row = document.createElement("tr");

                const status = article.analyzed === 1
                    ? '<span class="analyzed">已分析</span>'
                    : '<span class="unanalyzed">未分析</span>';

                row.innerHTML = `
                    <td>${article.id}</td>
                    <td>${article.title}</td>
                    <td>${article.category}</td>
                    <td>${article.source}</td>
                    <td>${article.importance}</td>
                    <td>${status}</td>
                    <td>
                        ${
                            article.analyzed === 1
                                ? `<button onclick="showAnalysis(${article.id})">
                                       查看分析
                                   </button>`
                                : `<button onclick="analyzeArticle(${article.id})">
                                       分析
                                   </button>`
                        }
                    </td>
                `;

                list.appendChild(row);
            }
            document.getElementById("page-info").textContent =
            `第 ${currentOffset / pageSize + 1} 页`;
        }

        loadArticles();
        loadStats();
        loadHealth();
        async function analyzeArticle(articleId) {
            const response = await fetch(
                `/articles/${articleId}/analyze`,
                {
                    method: "POST",
                }
            );

            const result = await response.json();

            if (!response.ok) {
                alert(result.detail || "分析失败");
                return;
            }

            alert("分析完成");
            loadArticles();
            loadStats();
            loadHealth();
        }

        async function showAnalysis(articleId) {
            const response = await fetch(
                `/articles/${articleId}/analysis`
            );

            const analysis = await response.json();

            if (!response.ok) {
                alert(analysis.detail || "读取分析结果失败");
                return;
            }

            document.getElementById("analysis-content").innerHTML = `
                <p><strong>摘要：</strong>${analysis.summary}</p>
                <p><strong>分类：</strong>${analysis.category}</p>
                <p><strong>重要程度：</strong>${analysis.importance}/5</p>
                <p><strong>关键词：</strong>${analysis.keywords.join("、")}</p>
            `;

            document.getElementById("analysis-modal").style.display = "flex";
        }

        function closeAnalysisModal(event) {
            if (!event || event.target.id === "analysis-modal") {
                document.getElementById("analysis-modal").style.display = "none";
            }
        }

        async function analyzeBatch() {
            const button = document.getElementById("batch-button");

            button.disabled = true;
            button.textContent = "分析中……";

            try {
                const response = await fetch("/analysis/batch?limit=20", {
                    method: "POST"
                });

                const result = await response.json();

                if (!response.ok) {
                    alert(result.detail || "批量分析失败");
                    return;
                }

                alert(
                    `批量分析完成\n` +
                    `总数：${result.total}\n` +
                    `新分析：${result.analyzed}\n` +
                    `已跳过：${result.skipped}\n` +
                    `失败：${result.failed}`
                );

                loadArticles();
                loadStats();
            } finally {
                button.disabled = false;
                button.textContent = "批量分析文章";
            }
        }

        async function loadStats() {
            const response = await fetch("/stats");
            const stats = await response.json();

            document.getElementById("stats").innerHTML = `
                <div class="stat-card">
                    <span>文章总数</span>
                    <strong>${stats.total}</strong>
                </div>

                <div class="stat-card">
                    <span>平均重要程度</span>
                    <strong>${stats.average_importance}</strong>
                </div>

                <div class="stat-card">
                    <span>分类数量</span>
                    <strong>${stats.categories.length}</strong>
                </div>
            `;
        }

        function previousPage() {
            if (currentOffset === 0) {
                return;
            }

            currentOffset -= pageSize;
            loadArticles();
        }

        function nextPage() {
            if (currentPageCount < pageSize) {
                return;
            }

            currentOffset += pageSize;
            loadArticles();
        }

        function filterArticles() {
            currentOffset = 0;
            loadArticles();
        }

        async function importDevArticles() {
            const response = await fetch(
                "/sources/dev/import?tag=ai&limit=5",
                {
                    method: "POST"
                }
            );

            const result = await response.json();

            if (!response.ok) {
                alert(result.detail || "导入失败");
                return;
            }

            alert(
                `DEV 文章导入完成\n` +
                `获取：${result.fetched} 篇\n` +
                `新增：${result.imported} 篇\n` +
                `跳过：${result.skipped} 篇`
            );

            loadArticles();
            loadStats();
            loadHealth();
        }

        async function runPipeline() {
            const response = await fetch(
                "/pipeline/dev?tag=ai&limit=5",
                {
                    method: "POST"
                }
            );

            const result = await response.json();

            if (!response.ok) {
                alert(result.detail || "工作流执行失败");
                return;
            }

            alert(
                `工作流完成\n` +
                `导入文章：${result.import.imported} 篇\n` +
                `跳过文章：${result.import.skipped} 篇\n` +
                `新分析：${result.analysis.analyzed} 篇\n` +
                `失败：${result.analysis.failed} 篇`
            );

            loadArticles();
            loadStats();
            loadHealth();
        }

        async function loadHealth() {
            const response = await fetch("/health");
            const result = await response.json();

            const health = document.getElementById("health");

            if (response.ok && result.status === "ok") {
                health.textContent = "服务状态：正常";
                health.style.color = "green";
            } else {
                health.textContent = "服务状态：异常";
                health.style.color = "red";
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark");

            const enabled = document.body.classList.contains("dark");
            localStorage.setItem("darkMode", enabled ? "on" : "off");

            document.getElementById("theme-button").textContent =
                enabled ? "切换浅色模式" : "切换深色模式";
        }

        if (localStorage.getItem("darkMode") === "on") {
            document.body.classList.add("dark");
            document.getElementById("theme-button").textContent =
                "切换浅色模式";
        }
    </script>
</body>
</html>
